name: Publish Docker Images to ECR

on:
  push:
    branches: ["main"]
    paths:
      - images/**
      - "projects/**"
      - ".github/workflows/publish-images-to-ecr.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild all images"
        type: boolean
        default: false

      source_branch:
        description: Branch name to tag images with
        type: string
        default: main
      only_images:
        description: Comma separated images to rebuild
        type: string
        default: ''
      source_repo:
        description: "GitHub repo for platform source (owner/repo)"
        type: string
        default: xiaohanhuang/ml-platform
permissions:
  contents: read

concurrency:
  group: publish-images-to-ecr-${{ github.ref }}-${{ github.event_name }}-${{ inputs.force }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  # Update these to your AWS account / ECR registry.
  AWS_ROLE_ARN: arn:aws:iam::805673386114:role/github-actions-ecr-push-ml-platform-eks
  ECR_REGISTRY: 805673386114.dkr.ecr.us-west-2.amazonaws.com
  SOURCE_REPO: ${{ inputs.source_repo || 'xiaohanhuang/ml-platform' }}

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      changes: ${{ steps.changes.outputs.changes }}
      base_cpu: ${{ steps.changes.outputs.base_cpu }}
      base_gpu: ${{ steps.changes.outputs.base_gpu }}
      executor_pool: ${{ steps.changes.outputs.executor_pool }}
      executor_pool_cpu: ${{ steps.changes.outputs.executor_pool_cpu }}
      ray_worker: ${{ steps.changes.outputs.ray_worker }}
      training_llm: ${{ steps.changes.outputs.training_llm }}
      ml_gpu: ${{ steps.changes.outputs.ml_gpu }}
      notebook_cpu: ${{ steps.changes.outputs.notebook_cpu }}
      notebook_marimo: ${{ steps.changes.outputs.notebook_marimo }}
      notebook_marimo_vscode: ${{ steps.changes.outputs.notebook_marimo_vscode }}
      gpu_idle_monitor: ${{ steps.changes.outputs.gpu_idle_monitor }}
      spark_base: ${{ steps.changes.outputs.spark_base }}
      text2sql_serve: ${{ steps.changes.outputs.text2sql_serve }}
      workflow_cpu: ${{ steps.changes.outputs.workflow_cpu }}
      workflow_gpu: ${{ steps.changes.outputs.workflow_gpu }}
      execution_service: ${{ steps.changes.outputs.execution_service }}
      registry_service: ${{ steps.changes.outputs.registry_service }}
      backend: ${{ steps.changes.outputs.backend }}
      dashboard: ${{ steps.changes.outputs.dashboard }}

    steps:
      - uses: actions/checkout@v4

      - name: Decide build mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.force }}" == "true" ]]; then
              echo "mode=force" >> "$GITHUB_OUTPUT"
            elif [[ -n "${{ inputs.only_images }}" ]]; then
              echo "mode=auto" >> "$GITHUB_OUTPUT"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect image context changes
        id: changes
        if: steps.mode.outputs.mode == 'auto'
        uses: dorny/paths-filter@v3
        with:
          filters: |-
            base_cpu:
              - 'images/base/cpu/**'
              - 'images/versions.env'
            base_gpu:
              - 'images/base/gpu-torch/**'
              - 'images/versions.env'
            executor_pool:
              - 'images/workload/executor-gpu/**'
              - 'images/base/gpu-torch/**'
              - 'images/versions.env'
            executor_pool_cpu:
              - 'images/workload/executor-cpu/**'
              - 'images/base/cpu/**'
              - 'images/versions.env'
            ray_worker:
              - 'images/framework/ray-gpu/**'
              - 'images/base/gpu-torch/**'
              - 'images/versions.env'
            training_llm:
              - 'images/workload/training-llm/**'
              - 'images/framework/ray-gpu/**'
              - 'images/base/gpu-torch/**'
              - 'images/versions.env'
            ml_gpu:
              - 'images/workload/ml-gpu/**'
              - 'images/base/gpu-torch/**'
              - 'images/versions.env'
            notebook_cpu:
              - 'projects/jupyter/images/**'
              - 'projects/components/sdk/**'
            notebook_marimo:
              - 'projects/jupyter/images/Dockerfile.marimo'
              - 'projects/jupyter/images/requirements.txt'
              - 'projects/components/sdk/**'
            notebook_marimo_vscode:
              - 'projects/jupyter/images/Dockerfile.marimo.vscode'
              - 'projects/jupyter/images/vscode_proxy/**'
              - 'projects/jupyter/images/requirements.txt'
              - 'projects/components/sdk/**'
            gpu_idle_monitor:
              - 'projects/jupyter/gpu-idle-monitor/**'
            spark_base:
              - 'projects/spark/images/**'
            text2sql_serve:
              - 'projects/workflows/text2sql/serve/**'
            workflow_cpu:
              - 'projects/workflows/text2sql/images/Dockerfile.cpu'
              - 'projects/workflows/text2sql/config.py'
              - 'projects/workflows/text2sql/tasks/**'
              - 'projects/workflows/text2sql/pipeline.py'
            workflow_gpu:
              - 'projects/workflows/text2sql/images/Dockerfile.gpu'
              - 'projects/workflows/text2sql/config.py'
              - 'projects/workflows/text2sql/tasks/**'
              - 'projects/workflows/text2sql/pipeline.py'
            execution_service:
              - 'projects/components/services/execution-service/**'
            registry_service:
              - 'projects/components/services/registry-service/**'
            backend:
              - 'projects/backend/**'
              - 'backend/**'
              - 'cli/**'
              - 'pyproject.toml'
            dashboard:
              - 'projects/dashboard/**'

  skip:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'skip' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes == '[]')

    steps:
      - run: echo "No relevant Docker context changes (or manual run without force); skipping."

  # -- GPU stack: base-gpu -> executor-pool, ray-worker -> training-llm ----------
  build-gpu-stack:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes != '[]')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sync platform source code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: _source
      - run: ./sync_source.sh _source

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base-gpu-torch (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.base_gpu == 'true') || contains(github.event.inputs.only_images, 'base-gpu-torch')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo base-gpu-torch --dockerfile images/base/gpu-torch/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push executor-gpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.executor_pool == 'true') || contains(github.event.inputs.only_images, 'executor-gpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo executor-gpu --dockerfile images/workload/executor-gpu/Dockerfile --context images/workload/executor-gpu --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push ray-gpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.ray_worker == 'true') || contains(github.event.inputs.only_images, 'ray-gpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo ray-gpu --dockerfile images/framework/ray-gpu/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }} --build-args "BASE_IMAGE=${{ env.ECR_REGISTRY }}/ml-platform/base-gpu-torch:latest"
      - name: Build and push training-llm (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.training_llm == 'true') || contains(github.event.inputs.only_images, 'training-llm')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo training-llm --dockerfile images/workload/training-llm/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }} --build-args "BASE_IMAGE=${{ env.ECR_REGISTRY }}/ml-platform/ray-gpu:latest" "MLFLOW_VERSION=3.10.0" "OPENRLHF_VERSION=0.9.5" "VLLM_VERSION=0.17.0"
      - name: Build and push ml-gpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.ml_gpu == 'true') || contains(github.event.inputs.only_images, 'ml-gpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo ml-gpu --dockerfile images/workload/ml-gpu/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }} --build-args "REGISTRY=${{ env.ECR_REGISTRY }}" "REPO=ml-platform" "BASE_TAG=latest"
  build-cpu-stack:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes != '[]')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sync platform source code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: _source
      - run: ./sync_source.sh _source

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base-cpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.base_cpu == 'true') || contains(github.event.inputs.only_images, 'base-cpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo base-cpu --dockerfile images/base/cpu/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push executor-cpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.executor_pool_cpu == 'true') || contains(github.event.inputs.only_images, 'executor-cpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo executor-cpu --dockerfile images/workload/executor-cpu/Dockerfile --context images/workload/executor-cpu --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
  build-independent:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes != '[]')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sync platform source code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: _source
      - run: ./sync_source.sh _source

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push notebook-cpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.notebook_cpu == 'true') || contains(github.event.inputs.only_images, 'notebook-cpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo notebook-cpu --dockerfile projects/jupyter/images/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push notebook-marimo (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.notebook_marimo == 'true') || contains(github.event.inputs.only_images, 'notebook-marimo')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo notebook-marimo --dockerfile projects/jupyter/images/Dockerfile.marimo --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push notebook-marimo-vscode (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.notebook_marimo_vscode == 'true') || contains(github.event.inputs.only_images, 'notebook-marimo-vscode')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo notebook-marimo-vscode --dockerfile projects/jupyter/images/Dockerfile.marimo.vscode --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push gpu-idle-monitor (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.gpu_idle_monitor == 'true') || contains(github.event.inputs.only_images, 'gpu-idle-monitor')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo gpu-idle-monitor --dockerfile projects/jupyter/gpu-idle-monitor/Dockerfile --context projects/jupyter/gpu-idle-monitor --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push spark-base (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.spark_base == 'true') || contains(github.event.inputs.only_images, 'spark-base')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo spark-base --dockerfile projects/spark/images/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push text2sql-serve (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.text2sql_serve == 'true') || contains(github.event.inputs.only_images, 'text2sql-serve')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo text2sql-serve --dockerfile projects/workflows/text2sql/serve/Dockerfile --context projects/workflows/text2sql/serve --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push workflow-cpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.workflow_cpu == 'true') || contains(github.event.inputs.only_images, 'workflow-cpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo workflow-cpu --dockerfile projects/workflows/text2sql/images/Dockerfile.cpu --context projects/workflows/text2sql --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push workflow-gpu (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.workflow_gpu == 'true') || contains(github.event.inputs.only_images, 'workflow-gpu')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo workflow-gpu --dockerfile projects/workflows/text2sql/images/Dockerfile.gpu --context projects/workflows/text2sql --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push execution-service (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.execution_service == 'true') || contains(github.event.inputs.only_images, 'execution-service')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo execution-service --dockerfile projects/components/services/execution-service/Dockerfile --context projects/components/services/execution-service --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push registry-service (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.registry_service == 'true') || contains(github.event.inputs.only_images, 'registry-service')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo registry-service --dockerfile projects/components/services/registry-service/Dockerfile --context projects/components/services/registry-service --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push backend-api (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.backend == 'true') || contains(github.event.inputs.only_images, 'backend-api')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo backend-api --dockerfile projects/backend/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
      - name: Build and push dashboard (Smart SHA)
        if: (needs.detect.outputs.mode == 'force' || needs.detect.outputs.dashboard == 'true') || contains(github.event.inputs.only_images, 'dashboard')
        run: |-
          chmod +x build_image.py
          ./build_image.py --repo dashboard --dockerfile projects/dashboard/Dockerfile --context . --branch ${{ github.event.inputs.source_branch || 'main' }} --registry ${{ env.ECR_REGISTRY }}
