name: Publish Docker Images to ECR

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "projects/**"
      - "images/**"
      - ".github/workflows/publish-images-to-ecr.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild all images"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-images-to-ecr-${{ github.ref }}-${{ github.event_name }}-${{ inputs.force }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  # Update these to your AWS account / ECR registry.
  AWS_ROLE_ARN: arn:aws:iam::805673386114:role/github-actions-ecr-push-ml-platform-eks
  ECR_REGISTRY: 805673386114.dkr.ecr.us-west-2.amazonaws.com

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      changes: ${{ steps.changes.outputs.changes }}
      base_cpu: ${{ steps.changes.outputs.base_cpu }}
      base_gpu_torch: ${{ steps.changes.outputs.base_gpu_torch }}
      executor_gpu: ${{ steps.changes.outputs.executor_gpu }}
      executor_cpu: ${{ steps.changes.outputs.executor_cpu }}
      flyte_gpu: ${{ steps.changes.outputs.flyte_gpu }}
      flyte_cpu: ${{ steps.changes.outputs.flyte_cpu }}
      ray_worker: ${{ steps.changes.outputs.ray_worker }}
      training_llm: ${{ steps.changes.outputs.training_llm }}
      ml_gpu: ${{ steps.changes.outputs.ml_gpu }}
      notebook_cpu: ${{ steps.changes.outputs.notebook_cpu }}
      notebook_marimo: ${{ steps.changes.outputs.notebook_marimo }}
      notebook_marimo_vscode: ${{ steps.changes.outputs.notebook_marimo_vscode }}
      gpu_idle_monitor: ${{ steps.changes.outputs.gpu_idle_monitor }}
      spark_base: ${{ steps.changes.outputs.spark_base }}
      execution_service: ${{ steps.changes.outputs.execution_service }}
      backend_api: ${{ steps.changes.outputs.backend_api }}
      dashboard: ${{ steps.changes.outputs.dashboard }}

    steps:
      - uses: actions/checkout@v4

      - name: Decide build mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.force }}" == "true" ]]; then
              echo "mode=force" >> "$GITHUB_OUTPUT"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect image context changes
        id: changes
        if: steps.mode.outputs.mode == 'auto'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base_cpu:
              - 'images/base/cpu/**'
            base_gpu_torch:
              - 'images/base/gpu-torch/**'
            executor_gpu:
              - 'images/workload/executor-gpu/**'
              - 'images/base/gpu-torch/**'
            executor_cpu:
              - 'images/workload/executor-cpu/**'
              - 'images/base/cpu/**'
            flyte_gpu:
              - 'images/framework/flyte-gpu/**'
              - 'images/base/gpu-torch/**'
            flyte_cpu:
              - 'images/framework/flyte-cpu/**'
              - 'images/base/cpu/**'
            ray_worker:
              - 'images/framework/ray-gpu/**'
              - 'images/base/gpu-torch/**'
            training_llm:
              - 'images/workload/training-llm/**'
              - 'images/framework/ray-gpu/**'
              - 'images/base/gpu-torch/**'
            ml_gpu:
              - 'images/workload/ml-gpu/**'
              - 'images/base/gpu-torch/**'
            notebook_cpu:
              - 'projects/jupyter/images/**'
              - 'projects/components/sdk/**'
            notebook_marimo:
              - 'projects/jupyter/images/Dockerfile.marimo'
              - 'projects/jupyter/images/requirements.txt'
              - 'projects/components/sdk/**'
            notebook_marimo_vscode:
              - 'projects/jupyter/images/Dockerfile.marimo.vscode'
              - 'projects/jupyter/images/vscode_proxy/**'
              - 'projects/jupyter/images/requirements.txt'
              - 'projects/components/sdk/**'
            gpu_idle_monitor:
              - 'projects/jupyter/gpu-idle-monitor/**'
            spark_base:
              - 'projects/spark/images/**'
            execution_service:
              - 'projects/components/services/execution-service/**'
            backend_api:
              - 'backend/**'
            dashboard:
              - 'dashboard/**'

  skip:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'skip' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes == '[]')

    steps:
      - run: echo "No relevant Docker context changes (or manual run without force); skipping."

  # -- GPU stack: base-gpu -> executor-pool, ray-worker -> training-llm ----------
  build-gpu-stack:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes != '[]')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push base-gpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.base_gpu_torch == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/gpu-torch/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/base-gpu-torch:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/base-gpu-torch:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push flyte-gpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.flyte_gpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/framework/flyte-gpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.ECR_REGISTRY }}
            REPO=ml-platform
            BASE_TAG=latest
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/flyte-gpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/flyte-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push executor-pool
        continue-on-error: true
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.executor_gpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/workload/executor-gpu
          file: images/workload/executor-gpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.ECR_REGISTRY }}
            REPO=ml-platform
            BASE_TAG=latest
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/executor-gpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/executor-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ray-worker
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.ray_worker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/framework/ray-gpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.ECR_REGISTRY }}
            REPO=ml-platform
            BASE_TAG=latest
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/ray-worker:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/ray-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push training-llm
        continue-on-error: true
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.training_llm == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/workload/training-llm/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.ECR_REGISTRY }}/ml-platform/ray-worker:latest
            MLFLOW_VERSION=3.10.0
            OPENRLHF_VERSION=0.9.5
            VLLM_VERSION=0.17.0
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/training-llm:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/training-llm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ml-gpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.ml_gpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/workload/ml-gpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.ECR_REGISTRY }}
            REPO=ml-platform
            BASE_TAG=latest
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/ml-gpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/ml-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -- CPU stack: base-cpu -> executor-pool-cpu ---------------------------------
  build-cpu-stack:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes != '[]')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push base-cpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.base_cpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/cpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/base-cpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/base-cpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push flyte-cpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.flyte_cpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/framework/flyte-cpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.ECR_REGISTRY }}
            REPO=ml-platform
            BASE_TAG=latest
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/flyte-cpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/flyte-cpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push executor-pool-cpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.executor_cpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/workload/executor-cpu
          file: images/workload/executor-cpu/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.ECR_REGISTRY }}
            REPO=ml-platform
            BASE_TAG=latest
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/executor-cpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/executor-cpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -- Independent images (no base-cpu/base-gpu dependency) --------------------
  build-independent:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && needs.detect.outputs.changes != '[]')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push desk-cpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.notebook_cpu == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/jupyter/images/Dockerfile.desk-cpu
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/desk-cpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/desk-cpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notebook-marimo
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.notebook_marimo == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/jupyter/images/Dockerfile.marimo
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/notebook-marimo:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/notebook-marimo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push desk-gpu
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.notebook_marimo_vscode == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/jupyter/images/Dockerfile.marimo.vscode
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/desk-gpu:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/desk-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gpu-idle-monitor
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.gpu_idle_monitor == 'true'
        uses: docker/build-push-action@v6
        with:
          context: projects/jupyter/gpu-idle-monitor
          file: projects/jupyter/gpu-idle-monitor/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/gpu-idle-monitor:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/gpu-idle-monitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push spark-base
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.spark_base == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/spark/images/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/spark-base:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/spark-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push execution-service
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.execution_service == 'true'
        uses: docker/build-push-action@v6
        with:
          context: projects/components/services/execution-service
          file: projects/components/services/execution-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/execution-service:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/execution-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proprietary-services:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mode == 'force' || (needs.detect.outputs.mode == 'auto' && (needs.detect.outputs.backend_api == 'true' || needs.detect.outputs.dashboard == 'true'))

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dashboard
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.dashboard == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/dashboard:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/dashboard:${{ github.sha }}

      - name: Build and push backend-api
        if: needs.detect.outputs.mode == 'force' || needs.detect.outputs.backend_api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/ml-platform/backend-api:latest
            ${{ env.ECR_REGISTRY }}/ml-platform/backend-api:${{ github.sha }}

