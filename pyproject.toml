[project]
name = "ml-platform"
version = "0.2.0"
description = "ML Training Platform on AWS EKS — Flyte + Ray + Spark"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "flytekit>=1.10.0",
    "flytekitplugins-ray>=1.10.0",
    "flytekitplugins-kfpytorch>=1.10.0",
    "flytekitplugins-spark>=1.10.0",
    "jinja2>=3.1",
    "boto3>=1.34",
    "cloudpickle>=3.0",
    "httpx>=0.27.0",
    "requests>=2.31",
    "kubernetes>=28.0",
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
    "grpcio>=1.60.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
training = [
    "torch>=2.1",
    "ray[default]>=2.9.0",
    "transformers>=4.36",
    "datasets>=2.16",
    "peft>=0.7",
    "accelerate>=0.25",
    "deepspeed>=0.12",
]

spark = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
]

monitoring = [
    "mlflow>=2.10",
    "torch-tb-profiler>=0.4",
    "nvitop>=1.3",
]

feature-store = [
    "feast[redis,aws]>=0.40",
]

notebook = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "pandas>=2.1",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.1",
    "mypy>=1.8",
    "pandas>=2.1",
    "numpy>=1.26",
]

components-test = [
    "faiss-cpu>=1.7",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "chromadb>=0.4",
    "tiktoken>=0.5",
    "nltk>=3.8",
    "pypdf>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "numpy>=1.26",
]

all = [
    "ml-platform[training,spark,monitoring,feature-store,notebook,dev,components-test]",
]

[project.scripts]
mlp = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "projects/components/sdk/ml_platform_sdk"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.8",
    {include-group = "components-test"},
]

components-test = [
    "faiss-cpu>=1.7",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "chromadb>=0.4",
    "tiktoken>=0.5",
    "nltk>=3.8",
    "pypdf>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "numpy>=1.26",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".external", "docker-images-repo", "poc_dashboard", "tmp-soci-builder"]

[tool.black]
line-length = 100
extend-exclude = '''
/(
    \.external
    | tmp-soci-builder
)/
'''

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU node (deselect with '-m \"not gpu\"')",
]
