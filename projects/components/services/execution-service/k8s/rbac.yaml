apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution-service
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: execution-service
  namespace: default
rules:
  # Allow creating and deleting Jobs for remote execution
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Allow managing Pods for pool and reading logs for streaming
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Allow reading Job status
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: execution-service
  namespace: default
subjects:
  - kind: ServiceAccount
    name: execution-service
    namespace: default
roleRef:
  kind: Role
  name: execution-service
  apiGroup: rbac.authorization.k8s.io
