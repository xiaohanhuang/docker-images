apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: default
  labels:
    app: execution-service
spec:
  replicas: 1  # Must be 1 while pod pool is in-memory (see #260 for Redis coordination)
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      serviceAccountName: execution-service
      containers:
        - name: execution
          image: ml-platform/execution-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ECR_REGISTRY
              value: "805673386114.dkr.ecr.us-west-2.amazonaws.com"
            - name: POD_POOL_ENABLED
              value: "true"
            - name: POD_POOL_TTL_SECONDS
              value: "600"
            - name: NAMESPACE
              value: "default"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: default
  labels:
    app: execution-service
spec:
  type: ClusterIP
  selector:
    app: execution-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
