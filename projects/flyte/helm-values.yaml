# Flyte Binary Helm Values
# Chart: flyte-binary from https://flyteorg.github.io/flyte
# Version: v1.10.0

# External Postgres: standalone StatefulSet in postgres namespace (EBS-backed)
deployment:
  waitForDB:
    # Wait for Postgres TCP port before Flyte starts.
    # Using nc (netcat) which is available in the Flyte binary image.
    command:
      - sh
      - -c
      - "until nc -z postgres.postgres.svc.cluster.local 5432; do echo 'waiting for postgres'; sleep 2; done"
  extraPodSpec:
    nodeSelector:
      role: system
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::805673386114:role/ml-platform-s3-access-ml-platform-eks"

configuration:
  database:
    host: "postgres.postgres.svc.cluster.local"
    port: 5432
    dbname: "flyte"
    username: "flyte"
    # SECURITY: Do NOT commit real passwords here.
    # Inject at deploy time via:
    #   make install PG_PASSWORD=$(kubectl get secret postgres-credentials \
    #     -n postgres -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
    # The Makefile reads PG_PASSWORD from the environment and passes it via
    # --set configuration.database.password=$PG_PASSWORD
    password: ""  # overridden by --set in Makefile
  storage:
    metadataContainer: "ml-platform-data-ml-platform-eks-805673386114"
    userDataContainer: "ml-platform-data-ml-platform-eks-805673386114"
    provider: s3
    providerConfig:
      s3:
        region: "us-west-2"
        authType: "iam"
  # Enable the Ray and Spark plugins
  inline:
    task_resources:
      defaults:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "16"
        memory: "64Gi"
        gpu: "8"
    plugins:
      logs:
        kubernetes-enabled: true
        kubernetes-template-uri: 'http://k8s-monitori-grafana-8e443b47cf-1425963785.us-west-2.elb.amazonaws.com/explore?orgId=1&left=%7B%22datasource%22%3A%7B%22type%22%3A%22loki%22%2C%22uid%22%3A%22loki%22%7D%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bnamespace%3D%5C%22{{ "{{" }} .namespace {{ "}}" }}%5C%22%2C%20pod%3D%5C%22{{ "{{" }} .podName {{ "}}" }}%5C%22%2C%20container%3D~%5C%22.%2B%5C%22%7D%22%2C%22queryType%22%3A%22range%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22{{ "{{" }} .podRFC3339StartTime {{ "}}" }}%22%2C%22to%22%3A%22now%22%7D%7D'
      ray:
        enabled: true
      spark:
        enabled: true
        spark-config-default:
          - spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
          - spark.hadoop.fs.s3a.aws.credentials.provider: com.amazonaws.auth.WebIdentityTokenCredentialsProvider
