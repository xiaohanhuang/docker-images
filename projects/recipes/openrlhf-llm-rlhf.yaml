# RLHF Alignment Recipe — engine-schema compatible
# Full pipeline: SFT → Preference Data → Reward Model → PPO → Evaluate → Publish
#
# Component output references:
#   hf_dataset_loader        -> FlyteFile            -> o0
#   lora_finetune            -> Tuple[str,str,Dict]  -> o0 (checkpoint), o1 (run_id), o2 (metrics)
#   generate_preference_data -> Tuple[str,int,float] -> o0 (path), o1 (count), o2 (score)
#   train_reward_model       -> RewardModelOutput    -> .checkpoint_path, .accuracy, ...
#   benchmark_reward_model   -> dict               -> o0
#   rlhf_trainer             -> RLHFTrainerOutput    -> .checkpoint_path, .kl_divergence, ...
#   llm_judge                -> dict                 -> o0
#   registry_publisher       -> str                  -> o0

name: openrlhf-llm-rlhf
version: "1.0"
description: "Distributed RLHF alignment with OpenRLHF (SFT → Reward → PPO) - Multi-service architecture"
author: ml-platform-team
tags: [llm, rlhf, alignment, reinforcement-learning, genai]

# Pin each component to a known-good version.
# Per-step `version` overrides these; omit an entry to use latest.
component_versions:
  data.hf_dataset_loader.hf_dataset_loader: "v0.5.23-direct-stub"
  training.lora_finetune.lora_finetune: "v0.5.23-direct-stub"
  data.preference_data_generator.generate_preference_data: "v0.5.23-direct-stub"
  training.reward_model_trainer.train_reward_model: "v0.5.26-rm-merge"
  evaluation.reward_bench.benchmark_reward_model: "v0.5.23-direct-stub"
  training.distributed_rlhf_trainer.distributed_rlhf_trainer: "v0.5.35-mlflow-uri"
  evaluation.llm_judge.llm_judge: "v0.5.23-direct-stub"
  model.registry_publisher.registry_publisher: "v0.5.34-mlflow-resilient"

infrastructure:
  profiles:
    small:
      # 1x A10G (24 GB) per role — fits on a single g5.2xlarge each
      actor:
        instance_types: [g5.2xlarge]
        gpu_count: 1
        gpu_memory: 24GB
        cpu: "8"
        memory: "32GB"
      critic:
        instance_types: [g5.2xlarge]
        gpu_count: 1
        gpu_memory: 24GB
        cpu: "8"
        memory: "32GB"
    medium:
      # 4x A10G for actor, 1x for critic
      actor:
        instance_types: [g5.12xlarge]
        gpu_count: 4
        gpu_memory: 96GB
        cpu: "48"
        memory: "192GB"
      critic:
        instance_types: [g5.4xlarge]
        gpu_count: 1
        gpu_memory: 24GB
        cpu: "16"
        memory: "64GB"

  storage:
    checkpoints: efs
    datasets: s3

  node_pool_overrides:
    consolidation_policy: WhenEmpty
    ttl_after_empty: 300s

pipeline:
  parameters:
    base_model:
      type: string
      default: "facebook/opt-125m"
      description: "HuggingFace model ID for base model"

    dataset:
      type: string
      default: "Anthropic/hh-rlhf"
      description: "HuggingFace dataset name for RLHF training"

    model_name:
      type: string
      default: "test-rlhf"
      description: "Name to register the final aligned model under"

    dataset_subset:
      type: string
      default: ""
      description: "Optional dataset subset (empty string = load all)"

    num_train_samples:
      type: int
      default: 100
      description: "Number of training samples to load from dataset"

    sft_epochs:
      type: int
      default: 1
      description: "Number of supervised fine-tuning epochs"

    sft_lr:
      type: float
      default: 0.0002
      description: "SFT learning rate"

    lora_rank:
      type: int
      default: 16
      description: "LoRA rank (r) parameter"

    distributed_num_nodes:
      type: int
      default: 1
      description: "Number of nodes for OpenRLHF Ray training"

    distributed_num_gpus_per_node:
      type: int
      default: 1
      description: "GPUs per node for OpenRLHF actor training"

    distributed_max_epochs:
      type: int
      default: 1
      description: "Maximum OpenRLHF training epochs"

    distributed_colocate_critic_reward:
      type: bool
      default: true
      description: "Run critic/reward/reference colocated (true) or as external services (false)"

    reference_service_url:
      type: string
      default: ""
      description: "Optional external reference model service URL for non-colocated mode"

    reward_service_url:
      type: string
      default: ""
      description: "Optional external reward model service URL for non-colocated mode"

    redis_url:
      type: string
      default: ""
      description: "Optional external Redis URL for non-colocated mode"

    judge_model:
      type: string
      default: "heuristic"
      description: "LLM judge model for preference and alignment evaluation"

    samples_per_prompt:
      type: int
      default: 2
      description: "Candidate responses per prompt for preference generation"

    rm_epochs:
      type: int
      default: 1
      description: "Number of reward model training epochs"

    rm_lr:
      type: float
      default: 0.00001
      description: "Reward model learning rate"

    rm_batch_size:
      type: int
      default: 4
      description: "Reward model batch size per GPU"

    ppo_epochs:
      type: int
      default: 1
      description: "Number of PPO outer training epochs"

    ppo_rollouts:
      type: int
      default: 1024
      description: "Number of rollouts to collect per PPO epoch"

    ppo_lr:
      type: float
      default: 0.00001
      description: "PPO actor learning rate"

    kl_coef:
      type: float
      default: 0.1
      description: "KL divergence penalty coefficient"

    algorithm:
      type: string
      default: "ppo"
      description: "RL algorithm: ppo, reinforce, grpo, rloo, reinforce_baseline"

    registry_type:
      type: string
      default: "mlflow"
      description: "Model registry backend (mlflow, s3, huggingface)"

  steps:
    # ── Step 1: Load dataset ────────────────────────────────────────────────
    - name: load_dataset
      component: data.hf_dataset_loader.hf_dataset_loader
      infra: null
      config:
        dataset_name: "{{ parameters.dataset }}"
        split: train
        subset: "{{ parameters.dataset_subset }}"
        num_samples: "{{ parameters.num_train_samples }}"

    # ── Step 2: Supervised fine-tuning with LoRA ───────────────────────────
    - name: sft
      component: training.lora_finetune.lora_finetune
      infra: actor
      depends_on: [load_dataset]
      config:
        base_model: "{{ parameters.base_model }}"
        train_data_path: "{{ steps.load_dataset.outputs.o0 }}"
        val_data_path: null
        method: "lora"
        lora_r: "{{ parameters.lora_rank }}"
        lora_alpha: 32
        lora_target_modules: null
        epochs: "{{ parameters.sft_epochs }}"
        batch_size: 4
        learning_rate: "{{ parameters.sft_lr }}"
        gradient_accumulation_steps: 4
        mlflow_experiment: null
        trust_remote_code: false

    # ── Step 3: Generate preference pairs using LLM judge ─────────────────
    - name: generate_preferences
      component: data.preference_data_generator.generate_preference_data
      infra: actor
      depends_on: [sft]
      config:
        prompt_data_path: "{{ steps.load_dataset.outputs.o0 }}"
        generator_model: "{{ parameters.base_model }}"
        prompt_column: "chosen"
        judge_model: "{{ parameters.judge_model }}"
        n_candidates: "{{ parameters.samples_per_prompt }}"
        judge_criteria: "helpfulness, accuracy, safety"
        output_format: dpo
        scored_data_path: null

    # ── Step 4: Train reward model on preference data ──────────────────────
    - name: train_reward_model
      component: training.reward_model_trainer.train_reward_model
      infra: critic
      depends_on: [generate_preferences]
      config:
        base_model: "{{ parameters.base_model }}"
        preference_data_path: "{{ steps.generate_preferences.outputs.o0 }}"
        prompt_column: "prompt"
        chosen_column: "chosen"
        rejected_column: "rejected"
        modeling_type: "bradley_terry"
        epochs: "{{ parameters.rm_epochs }}"
        learning_rate: "{{ parameters.rm_lr }}"
        batch_size: "{{ parameters.rm_batch_size }}"
        gradient_accumulation_steps: 4
        max_length: 512
        use_lora: true
        lora_rank: "{{ parameters.lora_rank }}"
        lora_alpha: 32
        num_gpus: 1
        mlflow_tracking_uri: "http://mlflow.monitoring.svc.cluster.local"
        mlflow_experiment_name: "reward-model-training"

    # ── Step 5: Benchmark reward model on held-out preferences ────────────
    - name: evaluate_reward
      component: evaluation.reward_bench.benchmark_reward_model
      infra: critic
      depends_on: [train_reward_model]
      config:
        reward_model_path: "{{ steps.train_reward_model.outputs.checkpoint_path }}"
        benchmark: rewardbench
        categories: null
        batch_size: 8

    # ── Step 6: RL alignment (OpenRLHF distributed) ─────────────────────
    - name: ppo_alignment
      component: training.distributed_rlhf_trainer.distributed_rlhf_trainer
      infra: actor
      depends_on: [sft, train_reward_model, evaluate_reward]
      config:
        sft_model_path: "{{ steps.sft.outputs.o0 }}"
        reward_model_path: "{{ steps.train_reward_model.outputs.checkpoint_path }}"
        dataset_path: "{{ steps.load_dataset.outputs.o0 }}"
        algorithm: "{{ parameters.algorithm }}"
        prompt_column: "prompt"
        # Distributed configuration
        num_nodes: "{{ parameters.distributed_num_nodes }}"
        num_gpus_per_node: "{{ parameters.distributed_num_gpus_per_node }}"
        colocate_critic_reward: "{{ parameters.distributed_colocate_critic_reward }}"
        # Model overrides (null = use sft_model_path / reward_model_path)
        pretrain: ""
        reward_pretrain: ""
        # Training parameters
        max_epochs: "{{ parameters.distributed_max_epochs }}"
        ppo_epochs: "{{ parameters.ppo_epochs }}"
        learning_rate: "{{ parameters.ppo_lr }}"
        critic_learning_rate: 0.0
        rollout_batch_size: "{{ parameters.ppo_rollouts }}"
        micro_rollout_batch_size: 8
        train_batch_size: 128
        micro_train_batch_size: 4
        max_samples: "{{ parameters.num_train_samples }}"
        max_len: 512
        prompt_max_len: 256
        generate_max_len: 256
        # PPO hyper-parameters
        init_kl_coef: "{{ parameters.kl_coef }}"
        kl_target: 0.0
        cliprange: 0.2
        cliprange_value: 0.2
        gamma: 1.0
        lam: 0.95
        # DeepSpeed
        zero_stage: 2
        gradient_checkpointing: true
        bf16: true
        gradient_accumulation_steps: 1
        adam_offload: false
        # vLLM
        vllm_tensor_parallel_size: 1
        vllm_num_engines: 1
        vllm_gpu_memory_utilization: 0.5
        # Multi-service endpoints (used when colocate_critic_reward=false)
        reference_service_url: "{{ parameters.reference_service_url }}"
        reward_service_url: "{{ parameters.reward_service_url }}"
        redis_url: "{{ parameters.redis_url }}"
        # Checkpointing
        checkpoint_interval: -1
        save_path: ""
        async_checkpoint: false
        # Logging
        logging_steps: 1
        eval_steps: -1
        mlflow_experiment: ""
        # Advanced optimizations (Phase 3)
        use_hybrid_engine: false
        enable_ring_attention: false
        flash_attention: true
        enable_efa: false

    # ── Step 7: Evaluate alignment quality with LLM judge ─────────────────
    - name: evaluate_alignment
      component: evaluation.llm_judge.llm_judge
      infra: null
      depends_on: [ppo_alignment]
      config:
        predictions_path: "{{ steps.ppo_alignment.outputs.checkpoint_path }}"
        ground_truth_path: "{{ steps.load_dataset.outputs.o0 }}"
        judge_model: "{{ parameters.judge_model }}"
        scorers: ["helpfulness", "safety", "accuracy"]
        custom_rubric: null
        sample_size: 200
        thresholds: null
        mlflow_experiment: null

    # ── Step 8: Register aligned model to MLflow ───────────────────────────
    - name: publish
      component: model.registry_publisher.registry_publisher
      infra: null
      depends_on: [evaluate_alignment]
      config:
        checkpoint_path: "{{ steps.ppo_alignment.outputs.checkpoint_path }}"
        model_name: "{{ parameters.model_name }}"
        base_model: "{{ parameters.base_model }}"
        eval_metrics: "{{ steps.evaluate_alignment.outputs.o0 }}"
        training_method: "rlhf"

presets:
  # ── Small: smoke-test on a single g5.2xlarge, opt-125m, 100 samples ─────
  small:
    profile: small
    overrides:
      parameters.base_model: "facebook/opt-125m"
      parameters.num_train_samples: 100
      parameters.distributed_num_nodes: 1
      parameters.distributed_num_gpus_per_node: 1
      parameters.distributed_max_epochs: 1
      parameters.distributed_colocate_critic_reward: true
      parameters.sft_epochs: 1
      parameters.lora_rank: 8
      parameters.samples_per_prompt: 2
      parameters.rm_epochs: 1
      parameters.rm_batch_size: 2
      parameters.ppo_epochs: 1
      parameters.ppo_rollouts: 64

  # ── Medium: high-throughput single-node run (colocated services) ────────
  medium:
    profile: medium
    overrides:
      parameters.base_model: "meta-llama/Llama-3.1-8B"
      parameters.num_train_samples: 10000
      parameters.distributed_num_nodes: 1
      parameters.distributed_num_gpus_per_node: 4
      parameters.distributed_max_epochs: 2
      parameters.distributed_colocate_critic_reward: true
      parameters.sft_epochs: 3
      parameters.lora_rank: 32
      parameters.samples_per_prompt: 4
      parameters.rm_epochs: 2
      parameters.rm_batch_size: 8
      parameters.ppo_epochs: 2
      parameters.ppo_rollouts: 512

  # ── Production: external service topology + real judge endpoint ─────────
  production:
    profile: medium
    overrides:
      parameters.base_model: "meta-llama/Llama-3.1-8B"
      parameters.num_train_samples: 20000
      parameters.distributed_num_nodes: 1
      parameters.distributed_num_gpus_per_node: 4
      parameters.distributed_max_epochs: 3
      parameters.distributed_colocate_critic_reward: false
      parameters.reference_service_url: "http://openrlhf-llm-rlhf-reference.default.svc.cluster.local:8080"
      parameters.reward_service_url: "http://openrlhf-llm-rlhf-reward.default.svc.cluster.local:8080"
      parameters.redis_url: "redis://openrlhf-llm-rlhf-buffer.default.svc.cluster.local:6379"
      parameters.judge_model: "vllm://default@http://openrlhf-judge.default.svc.cluster.local:8000/v1"
      parameters.sft_epochs: 3
      parameters.lora_rank: 32
      parameters.samples_per_prompt: 4
      parameters.rm_epochs: 2
      parameters.rm_batch_size: 8
      parameters.ppo_epochs: 2
      parameters.ppo_rollouts: 1024

# ──────────────────────────────────────────────────────────────────────────────
# Multi-Service Architecture for Distributed RLHF (Phase 3)
# ──────────────────────────────────────────────────────────────────────────────
# Defines the distributed service topology for production-scale OpenRLHF
# training.  auto_deploy is True: the recipe engine deploys buffer, reference,
# and reward services to K8s before submitting the pipeline.
#
# Prerequisites:
#   - Model weights cached at MODEL_CACHE_DIR (/mnt/efs/models) on EFS
#   - For the "small" preset, the distributed_rlhf_trainer runs in colocated
#     single-node mode (colocate_critic_reward=True) — no external services needed.
#
# Service Topology:
#   Actor (policy model) ←→ Critic (value network)     [NCCL gradient sync]
#   Actor → Reference (frozen SFT)                      [HTTP for KL penalty]
#   Actor → Reward (reward model)                       [HTTP for scoring]
#   Actor ←→ Buffer (Redis)                             [TCP for trajectory streaming]
#
# Lifecycle:
#   Stage 1: Start buffer, reference, reward (dependencies)
#   Stage 2: Start actor, critic (training services)
# ──────────────────────────────────────────────────────────────────────────────
architecture:
  auto_deploy: true

  groups:
    buffer:
      component: redis.cluster
      replicas: 1
      gpus_per_replica: 0
      instance: m5.xlarge
      cpu: "2"
      memory: "8GB"
      image: redis:7.2-alpine
      env:
        REDIS_CLUSTER_ENABLED: "yes"

    reference:
      component: services.vllm_reference_server
      replicas: 1
      gpus_per_replica: 1
      instance: g5.12xlarge
      cpu: "8"
      memory: "32GB"
      image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/training-llm:1.1.0
      command: ["python", "-m", "uvicorn", "vllm_reference_server:app", "--host", "0.0.0.0", "--port", "8080"]
      env:
        VLLM_TENSOR_PARALLEL_SIZE: "1"
        MODEL_CACHE_DIR: /mnt/efs/models

    reward:
      component: services.reward_model_server
      replicas: 1
      gpus_per_replica: 1
      instance: g5.12xlarge
      cpu: "8"
      memory: "32GB"
      image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/training-llm:1.1.0
      command: ["python", "-m", "uvicorn", "reward_model_server:app", "--host", "0.0.0.0", "--port", "8080"]
      env:
        BACKEND: transformers
        MODEL_CACHE_DIR: /mnt/efs/models

    actor:
      component: training.distributed_rlhf_trainer
      replicas: 1
      gpus_per_replica: 4
      instance: g5.12xlarge
      cpu: "48"
      memory: "192GB"
      image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/training-llm:1.1.0
      env:
        NCCL_IB_DISABLE: "1"
        NCCL_SOCKET_IFNAME: eth0
        NCCL_DEBUG: INFO
        RAY_BACKEND_LOG_LEVEL: info
        MODEL_CACHE_DIR: /mnt/efs/models
        CHECKPOINT_DIR: /mnt/efs/checkpoints

    critic:
      component: training.distributed_rlhf_trainer
      replicas: 1
      gpus_per_replica: 4
      instance: g5.12xlarge
      cpu: "48"
      memory: "192GB"
      image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/training-llm:1.1.0
      env:
        NCCL_IB_DISABLE: "1"
        NCCL_SOCKET_IFNAME: eth0
        NCCL_DEBUG: INFO
        MODEL_CACHE_DIR: /mnt/efs/models
        CHECKPOINT_DIR: /mnt/efs/checkpoints

  connections:
    - from_group: actor
      to_group: critic
      type: gradient
      protocol: nccl
      placement: same_az
      bidirectional: true

    - from_group: actor
      to_group: reference
      type: request
      protocol: http
      load_balancing: round_robin
      placement: same_az

    - from_group: actor
      to_group: reward
      type: request
      protocol: http
      load_balancing: round_robin
      placement: same_az

    - from_group: actor
      to_group: buffer
      type: stream
      protocol: redis
      placement: any
      bidirectional: true

    - from_group: critic
      to_group: buffer
      type: stream
      protocol: redis
      placement: any
      bidirectional: true

  lifecycle:
    startup_order:
      1: [buffer, reference, reward]
      2: [actor, critic]

    health_checks:
      buffer:
        endpoint: /health
        timeout: 60s
        interval: 10s
        retries: 3

      reference:
        endpoint: /health
        timeout: 300s
        interval: 30s
        retries: 5

      reward:
        endpoint: /health
        timeout: 180s
        interval: 20s
        retries: 5

      actor:
        endpoint: /health
        timeout: 600s
        interval: 60s
        retries: 10

      critic:
        endpoint: /health
        timeout: 600s
        interval: 60s
        retries: 10

    shutdown_grace_period: 120s
