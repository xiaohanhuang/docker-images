# MLflow PostgreSQL credentials Secret
#
# SECURITY: Do NOT commit real passwords to this file.
# Create the mlflow-db-credentials Secret externally before applying postgres-init-mlflow.yaml:
#
#   kubectl create secret generic mlflow-db-credentials \
#     -n postgres \
#     --from-literal=MLFLOW_PASSWORD='<your-mlflow-password>'
#
#   kubectl create secret generic mlflow-db-credentials \
#     -n monitoring \
#     --from-literal=POSTGRES_PASSWORD='<your-mlflow-password>'
#
# Or provision via AWS Secrets Manager / a GitOps secrets operator.
# The block below exists only to declare the expected keys; it must be
# replaced with the externally-created version before first apply.
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db-credentials
  namespace: postgres
type: Opaque
# stringData is intentionally empty here — populate via the kubectl command above.
# stringData:
#   MLFLOW_PASSWORD: "<set-externally>"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db-credentials
  namespace: monitoring
type: Opaque
# stringData is intentionally empty here — populate via the kubectl command above.
# stringData:
#   POSTGRES_PASSWORD: "<set-externally>"
