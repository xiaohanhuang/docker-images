apiVersion: v1
kind: Service
metadata:
  name: ml-platform-api
  namespace: ml-platform-development
spec:
  selector:
    app: ml-platform-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-api
  namespace: ml-platform-development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-platform-api
  template:
    metadata:
      labels:
        app: ml-platform-api
    spec:
      serviceAccountName: ml-platform-api
      containers:
        - name: api
          image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/backend-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: FLYTE_ENDPOINT
              value: "flyte-binary-grpc.flyte.svc.cluster.local:8089"
            - name: FLYTE_PROJECT
              value: "flytesnacks"
            - name: FLYTE_DOMAIN
              value: "development"
            - name: AUDIT_LOG_FILE
              value: "/var/log/ml-platform/audit.log"
            - name: FLYTE_CONSOLE_URL
              value: "http://k8s-flyte-flytecon-a425d1f87c-1407955100.us-west-2.elb.amazonaws.com"
          volumeMounts:
            - name: audit-logs
              mountPath: /var/log/ml-platform
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: audit-logs
          # Secondary audit sink; stdout (via container logs) is the primary sink
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-platform-api
  namespace: ml-platform-development
---
# ClusterRole for cluster-scoped resources (nodes) only
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-platform-api-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-platform-api-nodes
subjects:
  - kind: ServiceAccount
    name: ml-platform-api
    namespace: ml-platform-development
roleRef:
  kind: ClusterRole
  name: ml-platform-api-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced Role for pod/job operations in ml-platform
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-platform-api
  namespace: ml-platform-development
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-platform-api
  namespace: ml-platform-development
subjects:
  - kind: ServiceAccount
    name: ml-platform-api
    namespace: ml-platform-development
roleRef:
  kind: Role
  name: ml-platform-api
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced Role for pod/job operations in flytesnacks-development
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-platform-api
  namespace: flytesnacks-development
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-platform-api
  namespace: flytesnacks-development
subjects:
  - kind: ServiceAccount
    name: ml-platform-api
    namespace: ml-platform-development
roleRef:
  kind: Role
  name: ml-platform-api
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced Role for pod/job operations in default namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-platform-api
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-platform-api
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ml-platform-api
