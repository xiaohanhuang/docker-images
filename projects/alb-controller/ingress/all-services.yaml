---
# Ingress for Flyte Console (HTTP UI)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyte-console
  namespace: flyte
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthcheck
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/inbound-cidrs: "73.189.177.0/24,165.225.10.0/24"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flyte-binary-http
                port:
                  number: 8088

---
# NOTE: Flyte gRPC ingress removed. ALB only supports HTTP/HTTPS backend protocols,
# not GRPC. gRPC requires HTTP/2 which ALB doesn't support without TLS.
# FlyteAdmin gRPC is accessible via:
#   - Port-forward: kubectl port-forward -n flyte svc/flyte-binary-grpc 8089:8089
#   - In-cluster: flyte-binary-grpc.flyte.svc.cluster.local:8089

