apiVersion: v1
kind: ServiceAccount
metadata:
  name: singleuser
  namespace: jupyter
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::805673386114:role/ml-platform-s3-access-ml-platform-eks
---
# Allow the singleuser service account to delete its own pod so the
# GPU idle-shutdown monitor sidecar can self-terminate idle sessions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: singleuser-pod-delete
  namespace: jupyter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: singleuser-pod-delete
  namespace: jupyter
subjects:
  - kind: ServiceAccount
    name: singleuser
    namespace: jupyter
roleRef:
  kind: Role
  name: singleuser-pod-delete
  apiGroup: rbac.authorization.k8s.io
