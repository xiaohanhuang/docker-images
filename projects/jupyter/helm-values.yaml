                - "-c"
                - "echo $JUPYTERHUB_API_TOKEN > /var/idle-monitor/token"
        extra_containers:
          - name: idle-monitor
            image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/gpu-idle-monitor:12464b930fc0ff3ba16fb00f67ca83689cf203f2
            imagePullPolicy: Always
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: IDLE_THRESHOLD_SECONDS
                value: "1800"
              - name: CHECK_INTERVAL_SECONDS
                value: "60"
            volumeMounts:
              - name: idle-monitor-token
                mountPath: /var/idle-monitor
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"

    - display_name: "GPU - Single A10G High-Mem (32 CPU, 24GB VRAM, 128GB RAM)"
      description: "1x NVIDIA A10G (g5.8xlarge) - For heavy data loading"
      kubespawner_override:
        image: 805673386114.dkr.ecr.us-west-2.amazonaws.com/ml-platform/notebook-custom:12464b930fc0ff3ba16fb00f67ca83689cf203f2
        image_pull_policy: Always
        cmd: ["/opt/venv/bin/jupyterhub-singleuser"]
        cpu_limit: 32
        cpu_guarantee: 16
        mem_limit: "128G"
        mem_guarantee: "64G"
        extra_resource_limits:
          nvidia.com/gpu: "1"
        node_selector:
          node.kubernetes.io/instance-type: "g5.8xlarge"
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
        lifecycle_hooks:
